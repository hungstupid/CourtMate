name: courtmate
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: courtmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
      POSTGRES_DB: courtmate
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtmate -d courtmate"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
