services:
  - type: web
    name: courtmate-api
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/hungstupid/CourtMate
    branch: main
    rootDir: src/backend
    buildCommand: pip install uv==0.13.5 && uv sync --locked --no-dev
    startCommand: uv run --no-sync python -m app.scripts.start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: APP_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: courtmate-t05-nexora
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
